[build]
  command = "npm run build"
  publish = ".output/public"
  node_version = "24"

[build.environment]
  NODE_VERSION = "24"
  # Prevents native module compilation issues with better-sqlite3
  # Skip rebuilding better-sqlite3 - it's used only at build time
  npm_config_build_from_source = "false"
  # Increase timeout for build
  NETLIFY_BUILD_TIMEOUT = "600"

# Prevent function creation - static site only
[functions]
  directory = "netlify/functions"

# Handle SPA fallback for any client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200