[build]
  command = "npm run build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NPM_FLAGS = "--legacy-peer-deps"

# Enable caching
[build.processing]
  skip_processing = false

# Note: no trailing-slash redirects here. Netlify ignores trailing slashes when
# matching redirect rules, so a rule like "/about" -> "/about/" also matches
# "/about/" and causes an infinite redirect loop. Netlify's Pretty URLs already
# redirect /about to /about/ because the page is prerendered as about/index.html.

# The static build emits a multi-sitemap index at /sitemap_index.xml (referenced
# by robots.txt). Some crawlers/tools probe the conventional /sitemap.xml, so
# point it at the index instead of returning a 404.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap_index.xml"
  status = 301

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
